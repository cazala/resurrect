name: Publish packages and releases

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || 'next' }}
  cancel-in-progress: false

jobs:
  publish-next:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: package-publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master
        with:
          toolchain: "1.91.0"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - name: Verify crates.io credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "${CARGO_REGISTRY_TOKEN}"
      - name: Publish every crate and npm package as next
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          base_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          stable_base="${base_version%%-*}"
          scripts/publish-packages.sh \
            "${stable_base}-dev.${CI_RUN_NUMBER}.${CI_RUN_ATTEMPT}" \
            next

  validate-release:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "release tag must be a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >>"${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master
        with:
          toolchain: "1.91.0"
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace --all-targets --locked
      - run: forge test --root contracts
      - run: pnpm --recursive test
      - run: scripts/checklist-integration.sh

  publish-release:
    if: ${{ github.event_name == 'release' }}
    needs: validate-release
    runs-on: ubuntu-latest
    environment: package-publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master
        with:
          toolchain: "1.91.0"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - name: Verify crates.io credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "${CARGO_REGISTRY_TOKEN}"
      - name: Publish every crate and npm package as latest
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: scripts/publish-packages.sh "${{ needs.validate-release.outputs.version }}" latest

  binaries:
    if: ${{ github.event_name == 'release' }}
    needs: validate-release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master
        with:
          toolchain: "1.91.0"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: scripts/set-version.sh "${{ needs.validate-release.outputs.version }}"
        shell: bash
      - run: cargo build -p resurrect-node --release --locked
      - name: Archive Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="resurrect-node-${{ needs.validate-release.outputs.version }}-${RUNNER_OS}-${RUNNER_ARCH}"
          mkdir -p release-assets
          tar -C target/release -czf "release-assets/${name}.tar.gz" resurrect-node
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $name = "resurrect-node-${{ needs.validate-release.outputs.version }}-${env:RUNNER_OS}-${env:RUNNER_ARCH}.zip"
          Compress-Archive target/release/resurrect-node.exe "release-assets/$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/*

  release-assets:
    if: ${{ github.event_name == 'release' }}
    needs: [validate-release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true
      - run: cd release-assets && sha256sum * >SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*
      - name: Attach versioned binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" release-assets/* --clobber
