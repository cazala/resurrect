[workspace]
members = [
  "crates/rbp-core",
  "crates/rbp-ethereum",
  "crates/rbp-libp2p",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["RBP contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cazala/rbp"
homepage = "https://github.com/cazala/rbp"

[workspace.dependencies]
alloy = { version = "=1.0.30", default-features = true }
alloy-primitives = { version = "1.4.1", features = ["serde"] }
alloy-rlp = "0.3.12"
async-trait = "0.1.89"
enr = "0.13.0"
hex = "0.4.3"
libp2p-identity = { version = "0.2.13", features = ["ed25519", "peerid", "rand"] }
multiaddr = "0.18.2"
prost = "0.14.1"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt"] }
tracing = "0.1.41"
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
